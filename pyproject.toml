[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-old-photo-workflow"
version = "0.1.0"
description = "Agent-first old photo extraction, restoration, and colorization workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
include = ["agent_old_photo"]

[tool.pytest.ini_options]
pythonpath = ["."]

